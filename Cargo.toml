[package]
name = "cu-vitfly"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone Candle inference for the ViTFly ViT+LSTM depth policy"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
cu-ahrs = { path = "../copper-rs/components/tasks/cu_ahrs", version = "1.1.0" }
cu-zed = { path = "../zed/components/sources/cu_zed", version = "1.1.0" }
cu29 = { path = "../copper-rs/core/cu29", version = "1.1.0", default-features = false, features = ["reflect", "std", "units"] }

[dev-dependencies]
anyhow = "1.0"

[[example]]
name = "synthetic_depth"
path = "examples/synthetic_depth.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
