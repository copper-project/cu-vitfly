[package]
name = "cu-vitfly"
version = "1.3.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone Candle inference for the ViTFly ViT+LSTM depth policy"
readme = "README.md"
homepage = "https://github.com/copper-project"
repository = "https://github.com/copper-project/cu-vitfly"
documentation = "https://docs.rs/cu-vitfly"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
cached-path = { version = "0.10.0", default-features = false, features = [
  "progress-bar",
  "rustls-tls",
] }
cu-ahrs = { path = "../copper-rs/components/tasks/cu_ahrs", version = "1.3.0-dev" }
cu-zed = { path = "../zed/components/sources/cu_zed", version = "1.3.0-dev" }
cu29 = { path = "../copper-rs/core/cu29", version = "1.3.0-dev", default-features = false, features = [
  "reflect",
  "std",
  "units",
] }

[dev-dependencies]
anyhow = "1.0"

[[example]]
name = "synthetic_depth"
path = "examples/synthetic_depth.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
