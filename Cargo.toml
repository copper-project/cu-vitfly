[package]
name = "cu-vitfly"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone Candle inference for the ViTFly ViT+LSTM depth policy"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[patch."https://github.com/copper-project/copper-rs.git"]
cu-ahrs = { path = "../copper-rs/components/tasks/cu_ahrs" }
cu-sensor-payloads = { path = "../copper-rs/components/payloads/cu_sensor_payloads" }
cu-transform = { path = "../copper-rs/components/libs/cu_transform" }
cu29 = { path = "../copper-rs/core/cu29" }

[patch."https://github.com/copper-project/zed.git"]
cu-zed = { path = "../zed/components/sources/cu_zed" }

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
cu-ahrs = { git = "https://github.com/copper-project/copper-rs.git", branch = "master" }
cu-zed = { git = "https://github.com/copper-project/zed.git", branch = "master" }
cu29 = { git = "https://github.com/copper-project/copper-rs.git", branch = "master", default-features = false, features = ["reflect", "std", "units"] }

[dev-dependencies]
anyhow = "1.0"

[[example]]
name = "synthetic_depth"
path = "examples/synthetic_depth.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
